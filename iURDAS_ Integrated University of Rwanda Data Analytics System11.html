<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iURDAS: Integrated University of Rwanda Data Analytics System</title>
<style>
:root{--bg:#eaf0f6;--cd:#fff;--tx:#14213d;--mu:#56627f;--bd:#d3dcea;--ac:#1e90ff;--ac2:#2a3aa8;--tl:#1a5f7a;--sb:#124b63;--ok:#1b9a6b;--wn:#c98a00;--bad:#c93c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f26;--cd:#191a3a;--tx:#e8ecf8;--mu:#9aa5c6;--bd:#2c2e5a;--sb:#0a1a2c;--ok:#3ccf9a;--wn:#f0b429;--bad:#ff7070}}
:root[data-theme="dark"]{--bg:#0e0f26;--cd:#191a3a;--tx:#e8ecf8;--mu:#9aa5c6;--bd:#2c2e5a;--sb:#0a1a2c;--ok:#3ccf9a;--wn:#f0b429;--bad:#ff7070}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex}
aside{width:236px;background:var(--sb);color:#e8f1f7;padding:14px 10px;flex:none;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}.brand img{width:46px;height:46px;border-radius:50%;background:#fff}
.brand b{font-size:13px;line-height:1.2;display:block}.brand span{font-size:11px;opacity:.7}
nav button{display:flex;gap:9px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover{background:#ffffff14}nav button.on{background:var(--ac);color:#fff}
main{flex:1;min-width:0;padding:16px 20px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:21px;margin:0}h2{font-size:15px;margin:0 0 10px}
select,input,button.b{font:inherit;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button.b{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}button.b[disabled]{opacity:.4;cursor:not-allowed}button.g{background:var(--cd);color:var(--tx);border-color:var(--bd)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600}.chips button.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr);margin-bottom:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media(max-width:1000px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 6}}
@media(max-width:700px){body{display:block}aside{width:auto;height:auto;position:static}nav{display:flex;flex-wrap:wrap}nav button{width:auto}.grid>*{grid-column:span 12!important}}
.k b{display:block;font-size:24px}.k span{color:var(--mu);font-size:12px}.k i{font-style:normal;font-size:12px;float:right}.up{color:var(--ok)}.dn{color:var(--bad)}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.row u{text-decoration:none;width:128px;flex:none;color:var(--mu)}.row div{flex:1;background:var(--bd);border-radius:5px;height:12px;overflow:hidden}.row div i{display:block;height:100%;background:var(--ac);border-radius:5px}.row em{font-style:normal;width:52px;text-align:right}
.cols{display:flex;align-items:flex-end;gap:5px;height:150px}.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;font-size:10px;text-align:center;color:var(--mu)}.cols i{display:block;background:var(--ac)}.cols i.f{background:var(--ac2)}.cols i.p{background:transparent;border:1px dashed var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--bd)}
.fn{display:flex;gap:4px;align-items:stretch}.fn div{flex:1;background:var(--tl);color:#fff;padding:10px 6px;border-radius:6px;text-align:center;font-size:12px}.fn b{display:block;font-size:16px}
.drop{border:2px dashed var(--ac);border-radius:12px;padding:26px;text-align:center}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;font-size:12px;margin:8px 0 0}
.rep h3{margin:14px 0 4px;color:var(--ac2)}.rep p{margin:4px 0;max-width:80ch}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tl);color:#fff;padding:10px 14px;border-radius:8px;display:none;max-width:340px;z-index:9}
.note{color:var(--mu);font-size:12px}
#lg{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}body.lk #lg{display:flex}body.lk aside,body.lk main{display:none}#lg input{width:100%}</style></head><body class="lk"><div id="lg"><div class="c" style="max-width:420px;width:100%"><div style="text-align:center"><img id="lgi" alt="University of Rwanda logo" style="width:72px;height:72px;border-radius:50%;background:#fff"><h1 style="margin:8px 0 0">iURDAS</h1><div class="note">Integrated University of Rwanda Data Analytics System</div></div>
<p><label class="note">UR email (@ur.ac.rw)</label><br><input id="em" type="email" autocomplete="username" placeholder="name@ur.ac.rw" style="width:100%"></p><p><label class="note">Password</label><br><input id="pw" type="password" autocomplete="current-password" style="width:100%" onkeydown="if(event.key=='Enter')login()"></p>
<p><button class="b" style="width:100%" onclick="login()">Sign in</button></p><div id="lm" class="dn" role="alert"></div><p class="note"><button class="b g" id="th2" onclick="toggleTheme()"></button></p>
<details><summary class="note">Demo accounts (pre-registered)</summary><div id="ld" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div><p class="note">Demo mode accepts any password for registered @ur.ac.rw accounts. Production uses UR single sign-on with multi-factor authentication.</p></details></div></div>
